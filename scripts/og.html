<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'SG'; src: url('../src/fonts/space-grotesk-var.woff2') format('woff2'); font-weight: 300 700; }
@font-face { font-family: 'Plex'; src: url('../src/fonts/ibm-plex-sans-var.woff2') format('woff2'); font-weight: 100 700; }
@font-face { font-family: 'PlexMono'; src: url('../src/fonts/ibm-plex-mono-500.woff2') format('woff2'); font-weight: 500; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; }
body { background: #061316; color: #e9f2f1; font-family: 'Plex', sans-serif; position: relative; overflow: hidden; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(to right, #18323a 1px, transparent 1px), linear-gradient(to bottom, #18323a 1px, transparent 1px); background-size: 56px 56px; -webkit-mask-image: radial-gradient(ellipse at 80% 10%, #000 0%, transparent 70%); opacity: .7; }
.glow { position: absolute; width: 900px; height: 900px; right: -300px; top: -420px; background: radial-gradient(circle, rgba(52,188,174,.28), transparent 62%); }
.wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 18px; }
.mono { width: 56px; height: 56px; border-radius: 16px; background: #0b7a6f; display: grid; place-items: center; font-family: 'SG'; font-weight: 600; font-size: 21px; color: #fff; box-shadow: 0 0 0 6px rgba(52,188,174,.18); }
.name { font-family: 'SG'; font-weight: 500; font-size: 26px; letter-spacing: -.01em; }
.role { font-size: 18px; color: #93a9ab; margin-top: 2px; }
h1 { font-family: 'SG'; font-weight: 600; font-size: 76px; line-height: 1.02; letter-spacing: -.03em; margin-top: 54px; max-width: 980px; }
h1 span { color: #6fd6ca; }
.list { margin-top: auto; display: flex; gap: 44px; border-top: 1px solid #18323a; padding-top: 26px; }
.item b { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 20px; }
.item i { display: block; font-style: normal; color: #93a9ab; font-size: 16px; margin-top: 4px; padding-left: 20px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.live { background: #10b981; } .tf { background: #0ea5e9; } .beta { background: #f59e0b; }
</style></head>
<body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><div class="mono">BH</div><div><div class="name">Billel Helali</div><div class="role">Senior Full Stack Engineer · Rennes, France</div></div></div>
  <h1>I build <span>0→1</span> products people trust with their data.</h1>
  <div class="list">
    <div class="item"><b><span class="dot live"></span>Farouk.app</b><i>Live · 2,000+ users</i></div>
    <div class="item"><b><span class="dot tf"></span>ArabicPro</b><i>In TestFlight</i></div>
    <div class="item"><b><span class="dot live"></span>EchoTrust</b><i>Live · first customers</i></div>
    <div class="item"><b><span class="dot beta"></span>Doksima</b><i>Private beta</i></div>
  </div>
</div>
</body></html>
